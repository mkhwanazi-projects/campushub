<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" sizes="192x192" href="mfolozi.png">
    <link rel="apple-touch-icon" href="mfolozi.png">
    <meta name="theme-color" content="#000000">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Link Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">

    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- TensorFlow.js + COCO-SSD for Object Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.11.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --body-bg: url('light-bg.jpg'); 
            --container-bg: rgba(255, 255, 255, 0.45); 
            --text-color: #1a252f; 
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: 1px solid rgba(255, 255, 255, 0.4);
            --card-text: #2c3e50;
            --hub-title: #0056b3;
            --btn-gradient: linear-gradient(135deg, #0056b3, #00d4ff);
            --calc-bg: rgba(255, 255, 255, 0.5);
            --overlay-bg: rgba(255, 255, 255, 0.3);
            --keypad-btn: rgba(255, 255, 255, 0.7);
            --keypad-text: #2c3e50;
            --bulb-glow: drop-shadow(0 0 15px #f1c40f) drop-shadow(0 0 30px #f39c12);
            --bulb-color: #f1c40f;
        }

        [data-theme="dark"] {
            --bg-color: #09090e;
            --body-bg: url('mfolozi.png'); 
            --container-bg: rgba(15, 15, 25, 0.55);
            --text-color: #e2e8f0;
            --card-bg: rgba(255, 255, 255, 0.07);
            --card-border: 1px solid rgba(255, 255, 255, 0.12);
            --card-text: #ffffff;
            --hub-title: #00d4ff;
            --btn-gradient: linear-gradient(135deg, #7000ff, #00d4ff);
            --calc-bg: rgba(0, 0, 0, 0.3);
            --overlay-bg: rgba(0, 0, 0, 0.7);
            --keypad-btn: rgba(255, 255, 255, 0.1);
            --keypad-text: #ffffff;
            --bulb-glow: none;
            --bulb-color: #7f8c8d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            background-color: var(--bg-color);
            background-image: var(--body-bg); 
            background-size: contain; 
            background-repeat: no-repeat; 
            background-attachment: fixed; 
            background-position: center;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, background-image 0.4s ease;
        }
        
        .container {
            max-width: 1200px; 
            width: 90%;
            margin: 40px auto;
            padding: 25px;
            background: var(--container-bg);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: var(--card-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            transition: background 0.4s ease, border 0.4s ease;
        }

        .search-bar {
            width: 90%;
            max-width: 500px; 
            padding: 14px 20px;
            margin: 15px 0 25px 0;
            border: var(--card-border);
            border-radius: 50px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--card-text);
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus { 
            box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 15px;
        }

        .link-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--card-bg);
            border: var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 22px 12px;
            text-decoration: none;
            color: var(--card-text);
            border-radius: 18px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: transform 0.2s, background-color 0.4s ease, border 0.4s ease, box-shadow 0.2s;
        }

        .link-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(0, 212, 255, 0.4);
            box-shadow: 0 12px 20px rgba(0, 212, 255, 0.15);
        }

        .accordion-btn {
            grid-column: 1 / -1; 
            cursor: pointer;
        }

        .accordion-btn .arrow {
            margin-left: auto;
            transition: transform 0.3s ease;
        }

        .accordion-content {
            grid-column: 1 / -1; 
            max-height: 0;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 14px;
            border: var(--card-border);
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.15);
            text-align: center;
            color: var(--card-text);
        }

        [data-theme="light"] .accordion-content {
            background: rgba(255, 255, 255, 0.3);
        }

        .accordion-inner-box {
            padding: 20px;
        }

        .action-button {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 24px;
            background: var(--btn-gradient);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,212,255,0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
            width: 80%;
            max-width: 280px;
        }

        .action-button:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 20px rgba(0,212,255,0.5);
        }

        .calc-group {
            text-align: left;
            margin-bottom: 12px;
        }
        .calc-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        .calc-input {
            width: 90%;
            padding: 10px;
            border: var(--card-border);
            border-radius: 8px;
            background: var(--calc-bg);
            color: var(--card-text);
            font-weight: 600;
            outline: none;
        }
        .calc-select {
            width: 96%;
            padding: 10px;
            border: var(--card-border);
            border-radius: 8px;
            background: var(--calc-bg);
            color: var(--card-text);
            font-weight: 600;
            outline: none;
            margin-bottom: 15px;
        }
        .calc-result-box {
            margin-top: 15px;
            padding: 12px;
            background: var(--calc-bg);
            border-radius: 10px;
            border-left: 4px solid #00d4ff;
            border-top: var(--card-border);
            border-right: var(--card-border);
            border-bottom: var(--card-border);
            font-weight: bold;
            font-size: 14px;
            text-align: left;
        }

        .theme-switch-wrapper {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10;
        }

        .bulb-toggle {
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bulb-svg {
            width: 36px;
            height: 36px;
            fill: var(--bulb-color);
            filter: var(--bulb-glow);
            transition: fill 0.4s ease, filter 0.4s ease, transform 0.2s ease;
        }

        .bulb-toggle:hover .bulb-svg {
            transform: scale(1.1);
        }

        .calc-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .calc-overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .calculator-box {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: var(--card-border);
            border-radius: 24px;
            padding: 20px;
            width: 310px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .calc-popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 700;
            color: var(--card-text);
            margin-bottom: 12px;
            font-family: 'Montserrat', sans-serif;
        }
        .mode-toggle-btn {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            border: none;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-toggle-btn:hover {
            background: #00d4ff;
            color: #ffffff;
        }
        .close-calc {
            background: none; border: none; color: var(--card-text);
            font-size: 24px; cursor: pointer; opacity: 0.7;
            padding: 0; margin-left: 5px;
        }
        .close-calc:hover { opacity: 1; }
        
        #calculator-panel, #converter-panel {
            display: block;
        }
        #converter-panel {
            display: none;
            text-align: left;
        }

        #calc-screen {
            width: 100%;
            height: 55px;
            background: var(--calc-bg);
            border: var(--card-border);
            border-radius: 12px;
            color: var(--card-text);
            text-align: right;
            padding: 10px 15px;
            font-size: 22px;
            font-family: monospace;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .btn-input {
            background: var(--keypad-btn);
            border: var(--card-border);
            border-radius: 12px;
            color: var(--keypad-text);
            font-size: 16px;
            font-weight: 700;
            height: 45px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background 0.2s;
        }
        .btn-input:hover { background: rgba(255,255,255,0.25); }
        .btn-input.operator { color: #00d4ff; }
        .btn-input.functional { color: #ac55ff; }
        .btn-input.action-equal {
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
        }

        .conv-box-input {
            width: 100%;
            padding: 10px;
            border: var(--card-border);
            border-radius: 8px;
            background: var(--calc-bg);
            color: var(--card-text);
            font-weight: 600;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
        }

        /* ========== FLOATING IMAGE SCANNER BUTTON ========== */
        .floating-scanner-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--btn-gradient);
            color: white;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 212, 255, 0.4);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .floating-scanner-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.6);
        }

        /* Scanner Modal */
        .scanner-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10001;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .scanner-modal.active {
            opacity: 1;
            visibility: visible;
        }
        .scanner-box {
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border: var(--card-border);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }
        .scanner-box h3 {
            margin: 0 0 15px 0;
            color: var(--card-text);
            font-family: 'Montserrat', sans-serif;
        }
        .scanner-preview {
            width: 100%;
            max-height: 180px;
            object-fit: contain;
            border-radius: 12px;
            margin: 10px 0;
            display: none;
        }
        .scanner-result {
            background: var(--calc-bg);
            border: var(--card-border);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
            text-align: left;
            color: var(--card-text);
            font-size: 14px;
            min-height: 60px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .scanner-status {
            font-size: 13px;
            color: #00d4ff;
            margin: 10px 0;
            min-height: 20px;
        }
        .scanner-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .scanner-actions button {
            padding: 10px 18px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            background: var(--btn-gradient);
            color: white;
        }
        .result-label {
            font-size: 12px;
            font-weight: 700;
            color: #00d4ff;
            margin: 12px 0 4px 0;
            text-align: left;
        }

        /* ========== REALISTIC LAMP SPLASH ========== */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, #0a1f1a 0%, #02080a 70%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
            animation: floatBlob 22s ease-in-out infinite;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: #00ffc3;
            top: -150px; left: -150px;
        }
        .blob-2 {
            width: 400px; height: 400px;
            background: #00c3a0;
            bottom: -100px; right: -100px;
            animation-duration: 18s;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 300px; height: 300px;
            background: #00ff9d;
            top: 40%; left: 45%;
            opacity: 0.15;
            animation-duration: 25s;
            animation-delay: -10s;
        }
        @keyframes floatBlob {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .stars {
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(1px 1px at 20% 30%, #fff, transparent),
                radial-gradient(1px 1px at 40% 70%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60% 20%, #fff, transparent),
                radial-gradient(1px 1px at 80% 50%, #fff, transparent),
                radial-gradient(1px 1px at 10% 80%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 90% 10%, #fff, transparent);
            background-size: 200% 200%;
            opacity: 0.4;
            animation: twinkle 8s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.55; }
        }

        .splash-content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
        }

        .lamp-box {
            position: relative;
            width: 200px;
            height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform-origin: top center;
        }

        #splash-screen.lights-on .lamp-box {
            animation: lampSwing 3.5s ease-in-out infinite;
        }

        @keyframes lampSwing {
            0%   { transform: rotate(-4deg); }
            50%  { transform: rotate(4deg); }
            100% { transform: rotate(-4deg); }
        }

        .lamp-svg {
            width: 140px;
            height: 160px;
            filter: drop-shadow(0 8px 20px rgba(0,0,0,0.5));
            transition: filter 0.5s ease;
        }

        #splash-screen.lights-on .lamp-svg {
            filter: drop-shadow(0 0 25px #00ffc3) drop-shadow(0 0 50px rgba(0,255,195,0.4));
        }

        .pull-cord {
            position: absolute;
            top: 112px;
            left: 72px;
            width: 2px;
            height: 55px;
            background: #7a8a86;
            cursor: pointer;
            transform-origin: top center;
            transition: transform 0.12s ease-out, background 0.3s;
            z-index: 20;
        }
        .pull-cord::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: -6px;
            width: 14px;
            height: 14px;
            background: #a0b0ac;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        #splash-screen.lights-on .pull-cord {
            background: #00ffc3;
        }
        #splash-screen.lights-on .pull-cord::after {
            background: #00ffc3;
            box-shadow: 0 0 15px #00ffc3;
        }
        .pull-cord.snapping {
            transform: scaleY(1.35);
        }

        .light-cone {
            position: absolute;
            top: 108px;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            height: 340px;
            background: radial-gradient(
                ellipse at top,
                rgba(0, 255, 195, 0.7) 0%,
                rgba(0, 255, 195, 0.35) 20%,
                rgba(0, 195, 160, 0.15) 50%,
                transparent 75%
            );
            clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
            opacity: 0;
            pointer-events: none;
            filter: blur(6px);
            transition: opacity 0.6s ease;
            z-index: 2;
        }
        #splash-screen.lights-on .light-cone {
            opacity: 1;
        }

        .robot-wrapper {
            position: relative;
            width: 180px;
            height: 110px;
            margin-top: -15px;
            display: flex;
            justify-content: center;
            z-index: 4;
        }

        .robot {
            position: relative;
            transform: scale(1);
            opacity: 1;
            animation: robotFloat 2.4s ease-in-out infinite;
        }

        #splash-screen.lights-on .robot {
            opacity: 0;
            transform: scale(0.6);
            animation: none;
            transition: all 0.5s ease;
        }

        @keyframes robotFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50%     { transform: translateY(-10px) scale(1.04); }
        }

        .robot-face {
            width: 95px;
            height: 95px;
            background: radial-gradient(circle at 30% 30%, #1a3d35, #0d2a24 70%);
            border: 3px solid #00ffc3;
            border-radius: 50%;
            position: relative;
            box-shadow: 
                0 0 25px rgba(0,255,195,0.5),
                inset 0 -8px 15px rgba(0,0,0,0.4),
                inset 0 8px 12px rgba(0,255,195,0.15);
        }

        .robot-eye {
            position: absolute;
            top: 30px;
            width: 16px;
            height: 16px;
            background: #00ffc3;
            border-radius: 50%;
            box-shadow: 0 0 12px #00ffc3;
            animation: lookSequence 5s ease-in-out infinite;
        }
        .robot-eye.left { left: 22px; }
        .robot-eye.right { right: 22px; }

        @keyframes lookSequence {
            0%, 15%   { transform: translateX(-6px) scaleY(1); }
            25%, 40%  { transform: translateX(6px) scaleY(1); }
            50%, 65%  { transform: translateX(0) scaleY(1); }
            70%       { transform: translateX(0) scaleY(0.1); }
            75%, 100% { transform: translateX(0) scaleY(1); }
        }

        .robot-mouth {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 8px;
            border: 3px solid #00ffc3;
            border-top: none;
            border-radius: 0 0 12px 12px;
            box-shadow: 0 0 8px rgba(0,255,195,0.4);
            animation: smileSequence 5s ease-in-out infinite;
        }

        @keyframes smileSequence {
            0%, 45% {
                width: 20px;
                height: 6px;
                border-radius: 0 0 10px 10px;
            }
            55%, 100% {
                width: 32px;
                height: 16px;
                border-radius: 0 0 20px 20px;
                box-shadow: 0 0 12px rgba(0,255,195,0.8);
            }
        }

        .instruction-box {
            margin-top: 12px;
            height: 28px;
        }
        .splash-instruction {
            color: #5a7a72;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin: 0;
            transition: opacity 0.3s;
        }
        #splash-screen.lights-on .splash-instruction {
            opacity: 0;
        }

        .greeting-card {
            margin-top: 20px;
            background: rgba(0, 40, 35, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 195, 0.25);
            border-radius: 20px;
            padding: 20px 28px;
            min-width: 280px;
            max-width: 90vw;
            text-align: center;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        #splash-screen.lights-on .greeting-card {
            opacity: 1;
            transform: translateY(0);
        }

        #welcome-msg {
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 20px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin: 0;
            display: inline-block;
            border-right: 3px solid #00ffc3;
            white-space: normal;
            word-break: break-word;
            padding-right: 6px;
            text-shadow: 0 0 20px rgba(0,255,195,0.6);
            animation: blinkCursor 0.75s step-end infinite;
            min-height: 32px;
            line-height: 1.3;
            max-width: 90vw;
        }
        @keyframes blinkCursor {
            from, to { border-color: transparent; }
            50% { border-color: #00ffc3; }
        }

        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        @media (max-width: 500px) {
            .container { margin: 60px auto 20px auto; width: 88%; max-width: 420px; padding: 18px; }
            .links-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .link-card { padding: 22px 8px; font-size: 13px; }
            .light-cone { width: 300px; height: 300px; }
            .greeting-card { padding: 16px 20px; min-width: 240px; }
            #welcome-msg { font-size: 16px; }
            .floating-scanner-btn { bottom: 20px; right: 20px; width: 55px; height: 55px; }
        }
    </style>
</head>
<body> 
    <!-- Splash Screen + rest of the app remains the same -->
    <!-- For brevity I'm showing only the important updated scanner part. 
         Use the previous full code and replace the scanner section + scripts. -->

    <!-- ========== IMAGE SCANNER MODAL (Updated) ========== -->
    <div id="scanner-modal" class="scanner-modal">
        <div class="scanner-box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3>Image Scanner</h3>
                <button class="close-calc" onclick="closeScanner()">×</button>
            </div>

            <p style="font-size:13px; color:var(--card-text); opacity:0.8; margin:0 0 15px 0;">
                Take a photo or upload an image
            </p>

            <div class="scanner-actions">
                <button type="button" onclick="startCamera()">Take Photo</button>
                <button type="button" onclick="startUpload()">Upload Image</button>
            </div>

            <input type="file" accept="image/*" capture="environment" id="scannerCamera" hidden>
            <input type="file" accept="image/*" id="scannerUpload" hidden>

            <img id="scannerPreview" class="scanner-preview" alt="Preview">

            <div class="scanner-status" id="scannerStatus"></div>

            <div class="result-label">Detected Objects:</div>
            <div class="scanner-result" id="objectResult">No objects detected yet</div>

            <div class="result-label">Extracted Text:</div>
            <div class="scanner-result" id="scannerResult">No text extracted yet</div>

            <div class="scanner-actions" style="margin-top:15px;">
                <button onclick="translateText()" id="translateBtn" style="display:none;">Translate Text</button>
                <button onclick="copyText()" id="copyBtn" style="display:none;">Copy Text</button>
            </div>
        </div>
    </div>

    <button class="floating-scanner-btn" onclick="openScanner()" title="Image Scanner">📷</button>

    <!-- Keep the rest of your existing HTML (container, cards, calculator, splash, etc.) -->

    <script>
    // ========== IMAGE SCANNER WITH OBJECT DETECTION ==========
    let extractedText = "";
    let objectModel = null;

    // Load the object detection model when page loads
    cocoSsd.load().then(model => {
        objectModel = model;
        console.log("Object detection model loaded");
    }).catch(err => {
        console.error("Failed to load object model:", err);
    });

    function openScanner() {
        document.getElementById("scanner-modal").classList.add("active");
    }

    function closeScanner() {
        document.getElementById("scanner-modal").classList.remove("active");
        document.getElementById("scannerPreview").style.display = "none";
        document.getElementById("scannerResult").innerText = "No text extracted yet";
        document.getElementById("objectResult").innerText = "No objects detected yet";
        document.getElementById("scannerStatus").innerText = "";
        document.getElementById("translateBtn").style.display = "none";
        document.getElementById("copyBtn").style.display = "none";
        extractedText = "";
        document.getElementById("scannerCamera").value = "";
        document.getElementById("scannerUpload").value = "";
    }

    function startCamera() {
        const input = document.getElementById("scannerCamera");
        input.value = "";
        input.click();
    }

    function startUpload() {
        const input = document.getElementById("scannerUpload");
        input.value = "";
        input.click();
    }

    document.getElementById("scannerCamera").addEventListener("change", handleImage);
    document.getElementById("scannerUpload").addEventListener("change", handleImage);

    async function handleImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const preview = document.getElementById("scannerPreview");
        const status = document.getElementById("scannerStatus");
        const textResult = document.getElementById("scannerResult");
        const objectResult = document.getElementById("objectResult");

        status.innerText = "Preparing image...";
        textResult.innerText = "Processing...";
        objectResult.innerText = "Processing...";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const img = new Image();
            img.onload = async function() {
                // Resize for better performance
                const maxWidth = 640;
                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round(height * (maxWidth / width));
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, width, height);

                preview.src = canvas.toDataURL("image/jpeg", 0.85);
                preview.style.display = "block";

                // 1. Object Detection
                status.innerText = "Detecting objects...";
                try {
                    if (objectModel) {
                        const predictions = await objectModel.detect(canvas);
                        if (predictions.length > 0) {
                            const objects = predictions
                                .filter(p => p.score > 0.4)
                                .map(p => `\( {p.class} ( \){Math.round(p.score * 100)}%)`)
                                .join("\n");
                            objectResult.innerText = objects || "No clear objects detected";
                        } else {
                            objectResult.innerText = "No objects detected";
                        }
                    } else {
                        objectResult.innerText = "Object model still loading... try again";
                    }
                } catch (err) {
                    console.error(err);
                    objectResult.innerText = "Object detection failed";
                }

                // 2. Text Extraction (OCR)
                status.innerText = "Extracting text...";
                canvas.toBlob(async function(blob) {
                    try {
                        const result = await Tesseract.recognize(blob, 'eng', {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    status.innerText = `Extracting text... ${Math.round(m.progress * 100)}%`;
                                }
                            }
                        });
                        extractedText = result.data.text.trim();
                        if (extractedText) {
                            textResult.innerText = extractedText;
                            document.getElementById("translateBtn").style.display = "inline-block";
                            document.getElementById("copyBtn").style.display = "inline-block";
                        } else {
                            textResult.innerText = "No text found";
                        }
                        status.innerText = "Scan complete";
                    } catch (err) {
                        console.error(err);
                        textResult.innerText = "Text extraction failed";
                        status.innerText = "Done with errors";
                    }
                }, "image/jpeg", 0.85);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function translateText() {
        if (!extractedText) return;
        const url = `https://translate.google.com/?sl=auto&tl=en&text=${encodeURIComponent(extractedText)}&op=translate`;
        window.open(url, '_blank');
    }

    function copyText() {
        if (!extractedText) return;
        navigator.clipboard.writeText(extractedText).then(() => {
            document.getElementById("scannerStatus").innerText = "Text copied!";
        });
    }

    // ========== Keep all your existing JavaScript below ==========
    // (service worker, theme, calculator, splash, ICASS, machining, etc.)
    </script>
</body>
</html>
